name: Pipeline CI-CD - Estudiantes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas
        run: npm test

  entrega:
    needs: pruebas
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Crear paquete de entrega
        run: |
          mkdir -p entrega
          cp -r src entrega/
          cp package.json entrega/

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: proyecto-estudiantes
          path: entrega/

